[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delegate-agent-cli"
version = "0.21.0"
description = "A tiny CLI for delegating bounded agent tasks across coding-agent runtimes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Trey Goff" }]
dependencies = []
license = "MIT"
keywords = ["agents", "cli", "claude", "codex", "delegation", "cursor", "droid", "kimi", "omp", "pi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/treygoff24/delegate-agent"
Repository = "https://github.com/treygoff24/delegate-agent"
Issues = "https://github.com/treygoff24/delegate-agent/issues"
Documentation = "https://github.com/treygoff24/delegate-agent/tree/main/docs"
Security = "https://github.com/treygoff24/delegate-agent/security/policy"

[project.scripts]
delegate = "delegate_agent.cli:main"

[project.optional-dependencies]
# Dev tooling only — the runtime stays stdlib-only (dependencies = []).
# ruff is pinned so lint/format results are identical locally and in CI.
dev = [
  "ruff==0.15.15",
  "build>=1.0",
  "twine>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bin"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
