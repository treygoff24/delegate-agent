name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build twine ruff
      - run: python -m compileall -q src tests bin
      - run: python -m unittest discover -s tests
      - run: ruff check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Clean wheel install smoke
        run: |
          python -m venv "$RUNNER_TEMP/delegate-wheel-smoke"
          "$RUNNER_TEMP/delegate-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/delegate-wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/delegate-wheel-smoke/bin/delegate" --json describe
          "$RUNNER_TEMP/delegate-wheel-smoke/bin/delegate" --cwd "$PWD" --json dry-run codex safe "Smoke test. Do not edit."
